name: flake-update

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: flake-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          branch: flake-update
          commit-msg: "chore(nix): bump flake.lock"
          pr-title: "chore(nix): bump flake.lock"
          pr-reviewers: znaniye
          pr-body: |
            Automated weekly bump. Merge once garnix is green; close it to skip a week.

            ```
            {{ env.GIT_COMMIT_MESSAGE }}
            ```
